global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    monitor: 'swaptimize-monitor'

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files:
  - 'alert_rules.yml'

scrape_configs:
  - job_name: 'swaptimize'
    static_configs:
      - targets: ['192.168.1.14:9100']  # Swaptimize metrics endpoint (Host IP)
    scrape_interval: 30s
    scrape_timeout: 10s
    metrics_path: '/metrics'
    scheme: http

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
